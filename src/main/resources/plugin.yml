name: PurrTechCrops
version: '${version}'
description: Right-click fully grown crops to harvest and automatically replant them.
authors: [PurrTech]

main: eu.purrtech.purrTechCrops.PurrTechCrops
api-version: '1.21.11'
load: POSTWORLD
softdepend: [Residence]

permissions:
  purrtechcrops.use:
    description: Allows harvesting and replanting crops with a right click.
    default: true
  purrtechcrops.toggle:
    description: Allows turning right-click harvesting on and off for yourself with /ptc toggle.
    default: true
  purrtechcrops.admin:
    description: Allows reloading the configuration with /ptc reload.
    default: op
